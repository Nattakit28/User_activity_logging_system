
# =====================================
# GITLAB CI/CD - VITE + REACT
# =====================================

image: node:22

stages:
  - deploy

# =====================================
# CACHE
# =====================================

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

# =====================================
# DEPLOY TO GITLAB PAGES
# =====================================

deploy-pages:
  stage: deploy

  script:
    - echo "Installing dependencies..."
    - npm ci

    - echo "Building Vite application..."
    - npm run build

    - echo "Preparing SPA fallback..."
    - cp dist/index.html dist/404.html

    - echo "Build completed!"
    - ls -lh dist/

  pages:
    publish: dist

  environment:
    name: production
    url: $CI_PAGES_URL

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
